{% extends "solicitudes/indexpadre.html" %}
{% block title %}Descuento de Nómina{% endblock %}
{% block content %}
<div style="padding: 24px; max-width: 800px;">
    <a href="{% url 'nomina_descuentos' %}" style="color: #3b82f6; text-decoration: none;">← Volver</a>
    <h1 style="margin: 12px 0 24px;">💳 Descuento</h1>
    <form method="post" style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">{% csrf_token %}<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">{% for field in form %}<div><label style="display: block; font-weight: 600; margin-bottom: 6px;">{{ field.label }}</label>{{ field }}{% if field.errors %}<div style="color: #dc3545;">{{ field.errors.0 }}</div>{% endif %}</div>{% endfor %}</div><div style="margin-top: 24px; display: flex; gap: 12px;"><button type="submit" style="background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px;">Guardar</button><a href="{% url 'nomina_descuentos' %}" style="background: #e2e8f0; color: #334155; padding: 12px 24px; border-radius: 8px; text-decoration: none;">Cancelar</a></div></form>
</div>
{% endblock %}
