{% load l10n humanize %}
<div class="materiales-ot-modal" id="modal-agregar-material" role="dialog" aria-modal="true" aria-labelledby="titulo-modal-material" hidden>
    <div class="materiales-ot-modal-content">
        {% csrf_token %}
        <h3 id="titulo-modal-material">Agregar material a la OT</h3>
        <div class="materiales-ot-field">
            <label for="buscar-material-unificado">Buscar material o repuesto</label>
            <input type="search" id="buscar-material-unificado" class="form-control" list="materiales-catalogo" autocomplete="off" maxlength="150" placeholder="Ej: Rodamiento 6205...">
            <datalist id="materiales-catalogo">
                {% for m in materiales_catalogo %}
                <option value="{{ m.nombre }}" data-id="{{ m.id }}" data-costo="{{ m.costo_base|unlocalize }}" label="{{ m.codigo }} — {{ m.nombre }} — $ {{ m.costo_base|intcomma }}"></option>
                {% endfor %}
            </datalist>
        </div>
        <div class="materiales-ot-field">
            <label for="input-cantidad">Cantidad</label>
            <input type="number" id="input-cantidad" class="form-control" value="1" min="0.01" step="0.01">
        </div>
        <div class="materiales-ot-field">
            <label for="input-costo-real">Costo unitario real (según factura)</label>
            <input type="number" id="input-costo-real" class="form-control" min="0" step="0.01">
        </div>
        <div class="materiales-ot-field">
            <label for="input-foto-factura">Foto de factura o recibo (opcional)</label>
            <input type="file" id="input-foto-factura" class="form-control" accept="image/*" capture="environment">
        </div>
        <div class="materiales-ot-field">
            <label for="input-observaciones-material">Observación del material (opcional)</label>
            <textarea id="input-observaciones-material" class="form-control" rows="3" maxlength="5000"></textarea>
        </div>
        <div class="materiales-ot-error" id="error-material" role="alert" aria-live="polite"></div>
        <div class="materiales-ot-actions">
            <button type="button" class="cierre-ot-btn cierre-ot-btn-secondary" id="btn-cancelar-material">Cancelar</button>
            <button type="button" class="cierre-ot-btn cierre-ot-btn-primary" id="btn-guardar-material">Guardar material</button>
        </div>
    </div>
</div>
